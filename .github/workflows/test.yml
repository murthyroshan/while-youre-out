# Every push and pull request: type-check and run every test (server, simulator and the Alexa skill).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tsc -p alexa
      - run: npx tsx --test alexa/test/*.test.ts
      # The skill Amazon hosts is the built file: it must match its source.
      - run: node alexa/build.mjs && git diff --exit-code alexa/
