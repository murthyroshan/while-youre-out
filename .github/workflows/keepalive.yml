# Free hosts put idle apps to sleep (Render: after 15 minutes). Judging runs until Nov 20.
# UptimeRobot is the main 5-minute ping; this is a backup. GitHub may run schedules late.
# Set the repository variable DEMO_URL (e.g. https://while-youre-out.onrender.com).
name: Keep the demo awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 60 "${{ vars.DEMO_URL }}/health"
