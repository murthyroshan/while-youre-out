<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play the evening · While You're Out</title>
    <meta name="description" content="You're the babysitter tonight, in a 3D house. Maya is allergic to peanuts. Can you get through the evening, and what would the Echo Show have said?" />
    <!-- include:head -->
    <link rel="stylesheet" href="/src/game/game.css" />
  </head>
  <body class="page game intro" data-page="game">
    <!-- include:header -->
    <main id="main" class="arena">
      <canvas id="g-canvas" aria-hidden="true"></canvas>
      <div class="flash" id="g-flash" aria-hidden="true"></div>
      <div class="hud" role="group" aria-label="How the evening is going">
        <p class="clock"><span id="g-clock">5:54 pm</span><small>Saturday</small></p>
        <div class="meter" data-meter="safety"><span>Safety <em>100</em></span><i><b></b></i></div>
        <div class="meter" data-meter="rules"><span>House rules <em>100</em></span><i><b></b></i></div>
        <div class="meter" data-meter="mood"><span>Maya <em>70</em></span><i><b></b></i></div>
        <button class="sound" id="g-sound" type="button" aria-pressed="false">Mute sound</button>
      </div>
      <section class="panel" id="g-panel" aria-labelledby="g-title">
        <p class="sr-only" id="g-status" aria-live="polite"></p>
        <p class="when" id="g-when">A game · about 4 minutes</p>
        <h1 id="g-title">Tonight, you're the sitter.</h1>
        <p class="story" id="g-story"></p>
        <div class="timer" id="g-timer" hidden aria-hidden="true"><b></b><span></span></div>
        <div class="choices" id="g-choices"></div>
        <p class="note" id="g-note" hidden tabindex="-1"></p>
      </section>
      <aside class="device" aria-label="The kitchen Echo Show">
        <div class="bezel" id="g-device"></div>
        <p class="said" id="g-said" aria-live="polite"></p>
        <p class="cap">The kitchen Echo Show. Its words are the add-on's own, recorded from it.</p>
      </aside>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/game/game.ts"></script>
  </body>
</html>
