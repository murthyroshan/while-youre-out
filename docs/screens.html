<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every screen · While You're Out</title>
<style>
  body { margin: 0; background: #E9E7EC; color: #14181E; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  header { padding: 28px 32px 8px; } h1 { margin: 0; font-size: 26px; } header p { margin: 4px 0 0; color: #4A5361; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr)); gap: 28px 24px; padding: 24px 32px 48px; }
  figure { margin: 0; } figcaption { font-weight: 650; margin-bottom: 8px; } figcaption small { font-weight: 500; color: #5B6371; margin-left: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dev { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 0 0 6px #1B1D22; }
  .dev iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; } nav a { padding: 8px 14px; border-radius: 999px; background: #fff; color: #14181E; text-decoration: none; font-weight: 600; } nav a.on { background: #14181E; color: #fff; }
</style></head><body>
<header><h1>Every screen, in dark and light</h1><p id="lede"></p><nav id="devices" aria-label="Device"></nav></header>
<main class="grid" id="grid"></main>
<script>
const CARD = "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>While You're Out\u003c/title>\n\u003cstyle>/* While You're Out cards, built to the Alexa+ MCP add-on design guide.\r\n   Authored on the 768 x 480 base canvas with Alexa's own tokens; one root zoom (--scale, set from\r\n   the host's deviceClass) sizes everything for each device (1.667 on an Echo Show 8 or 15).\r\n   Light and dark both; flat cards with rounded corners; colour only on accents and final actions. */\r\n\r\n:root {\r\n  /* typography (base canvas) */\r\n  --t-d1: 48px; --t-d2: 40px; --t-d3: 32px; --t-d4: 28px; --t-d5: 24px;\r\n  --t-h1: 20px; --t-h2: 18px; --t-b1: 16px; --t-b2: 14px; --t-b3: 12px;\r\n  /* spacing */\r\n  --s-4xs: 2px; --s-2xs: 6px; --s-xs: 8px; --s-s: 12px; --s-m: 16px; --s-l: 20px; --s-xl: 24px;\r\n  --s-2xl: calc(var(--s-xl) + var(--s-xs));\r\n  /* shape */\r\n  --r-xs: 4px; --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-c: 9999px;\r\n  /* icons */\r\n  --i-s: 16px; --i-m: 20px; --i-l: 24px;\r\n  /* touch targets: 48 x 48 at least */\r\n  --target: 48px;\r\n  --scale: 1;\r\n  --vh: 100vh;\r\n  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);\r\n}\r\n\r\n/* Dark (the default on Echo Show) */\r\n:root, .theme-dark {\r\n  color-scheme: dark;\r\n  --page: #0B0E13;\r\n  --card: #14181E;           /* Alexa: dark card default */\r\n  --inner: #1B2028;          /* Alexa: dark nested inner */\r\n  --line: #2A313C;\r\n  --text: #FFFFFF;\r\n  --text-2: #C3CBD6;\r\n  --text-3: #9AA5B4;\r\n  --btn-1: #2D415E;          /* Alexa: dark primary button */\r\n  --btn-1-text: #FFFFFF;\r\n  --btn-2: #232F40;          /* Alexa: dark secondary button */\r\n  --btn-2-text: #FFFFFF;\r\n  --accent: #F2B544;         /* the porch light: our one brand accent */\r\n  --accent-ink: #1F1600;\r\n  --danger: #FF7A6E;         /* text on dark */\r\n  --danger-fill: #C8261B;    /* fills with white text */\r\n  --danger-soft: #3A1714;\r\n  --warn: #F2B544;\r\n  --warn-soft: #33270F;\r\n  --ok: #4ADE9B;\r\n  --ok-fill: #12784A;\r\n  --ok-soft: #10301F;\r\n  --focus: #8CC8FF;\r\n}\r\n.theme-light {\r\n  color-scheme: light;\r\n  --page: #FAF9FB;           /* Alexa: light nested outer */\r\n  --card: #FFFFFF;           /* Alexa: light card default */\r\n  --inner: #F3F1F5;\r\n  --line: #E3E0E8;\r\n  --text: #14181E;\r\n  --text-2: #3E4652;\r\n  --text-3: #5B6371;\r\n  --btn-1: #2D415E;\r\n  --btn-1-text: #FFFFFF;\r\n  --btn-2: #E8ECF2;\r\n  --btn-2-text: #14181E;\r\n  --accent: #9A5800;\r\n  --accent-ink: #FFFFFF;\r\n  --danger: #B42318;\r\n  --danger-fill: #B42318;\r\n  --danger-soft: #FDECEA;\r\n  --warn: #8A5300;\r\n  --warn-soft: #FFF4DE;\r\n  --ok: #067647;\r\n  --ok-fill: #067647;\r\n  --ok-soft: #E6F6EE;\r\n  --focus: #1F6FD6;\r\n}\r\n\r\n* { box-sizing: border-box; }\r\nhtml { zoom: var(--scale); }\r\nhtml, body { margin: 0; background: var(--page); color: var(--text); }\r\nbody {\r\n  font: 400 var(--t-b1) / 1.4 \"Amazon Ember\", Inter, \"SF Pro Text\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\r\n  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden;\r\n}\r\np { margin: 0; }\r\nb, strong { font-weight: 700; }\r\n.tab { font-variant-numeric: tabular-nums; }\r\nsvg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; }\r\nbutton { font: inherit; color: inherit; }\r\n:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\r\n\r\n/* ---------- the card (inline: a block, as wide as the canvas) ---------- */\r\n.card { padding: var(--s-m) var(--s-xl) var(--s-xl); background: var(--page); color: var(--text); }\r\n.card > .body { background: var(--card); border-radius: var(--r-l); padding: var(--s-l) var(--s-xl); }\r\n.card > .body > * + * { margin-top: var(--s-m); }\r\n\r\n/* attribution: the logo, top-left inline and top-center fullscreen */\r\n.brand { display: flex; align-items: center; gap: var(--s-xs); height: 28px; margin-bottom: var(--s-s); color: var(--text-2); font-size: var(--t-b2); font-weight: 700; letter-spacing: 0.01em; }\r\n.brand svg.logo { width: 22px; height: 22px; flex: none; }\r\n.fs .brand { justify-content: center; margin: 0; }\r\n\r\n.topic { display: flex; align-items: center; gap: var(--s-2xs); font-size: var(--t-b2); font-weight: 700; color: var(--text-3); }\r\n.topic svg.i { font-size: var(--i-m); color: var(--accent); }\r\n\r\n/* one title, one or two supporting fields, one action */\r\n.title { font-size: var(--t-d4); font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }\r\n.title.l { font-size: var(--t-d3); }\r\n.title.xl { font-size: var(--t-d1); line-height: 1.05; letter-spacing: -0.02em; }\r\n.field { font-size: var(--t-h1); line-height: 1.35; color: var(--text-2); }\r\n.field.s { font-size: var(--t-h2); }\r\n.meta { font-size: var(--t-b2); color: var(--text-3); }\r\n\r\n/* the parents' own words */\r\n.quote { background: var(--inner); border-radius: var(--r-m); padding: var(--s-s) var(--s-m); }\r\n.quote p { font-size: var(--t-h1); line-height: 1.35; font-weight: 600; color: var(--text); }\r\n.quote .by { display: flex; align-items: center; gap: var(--s-xs); margin-top: var(--s-2xs); font-size: var(--t-b2); color: var(--text-3); }\r\n.quote.close p { font-weight: 500; color: var(--text-2); }\r\n\r\n/* notices: safety first, then the guard line, then good news */\r\n.note { display: flex; gap: var(--s-s); align-items: flex-start; border-radius: var(--r-m); padding: var(--s-s) var(--s-m); background: var(--inner); }\r\n.note > svg.i { font-size: var(--i-l); margin-top: 1px; }\r\n.note strong { display: block; font-size: var(--t-h2); line-height: 1.3; }\r\n.note span { display: block; font-size: var(--t-b1); line-height: 1.4; color: var(--text-2); }\r\n.note.danger { background: var(--danger-soft); box-shadow: inset 4px 0 0 var(--danger-fill); }\r\n.note.danger > svg.i, .note.danger strong { color: var(--danger); }\r\n.note.warn { background: var(--warn-soft); box-shadow: inset 4px 0 0 var(--warn); }\r\n.note.warn > svg.i { color: var(--warn); }\r\n.note.ok { background: var(--ok-soft); box-shadow: inset 4px 0 0 var(--ok); }\r\n.note.ok > svg.i, .note.ok strong { color: var(--ok); }\r\n.note.info > svg.i { color: var(--accent); }\r\n\r\n.fine { font-size: var(--t-b3); line-height: 1.4; color: var(--text-3); }\r\n\r\n/* actions: at least 48 x 48, always labelled */\r\n.actions { display: flex; flex-wrap: wrap; gap: var(--s-xs); }\r\n.btn { appearance: none; -webkit-tap-highlight-color: transparent; min-height: var(--target); min-width: var(--target); padding: 0 var(--s-l); border: 0; border-radius: var(--r-c);\r\n  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-xs); font-size: var(--t-b1); font-weight: 700; line-height: 1.15; cursor: pointer;\r\n  background: var(--btn-2); color: var(--btn-2-text); transition: transform 0.15s var(--ease); }\r\n.btn svg.i { font-size: var(--i-m); }\r\n.btn:active { transform: scale(0.97); }\r\n.btn:disabled { opacity: 0.6; cursor: default; }\r\n.btn.primary { background: var(--btn-1); color: var(--btn-1-text); }\r\n.btn.danger { background: var(--danger-fill); color: #FFFFFF; }\r\n.btn.ok { background: var(--ok-fill); color: #FFFFFF; }\r\n\r\n.pill { display: inline-flex; align-items: center; gap: var(--s-2xs); min-height: 28px; padding: 0 var(--s-s); border-radius: var(--r-c); font-size: var(--t-b2); font-weight: 700; white-space: nowrap; background: var(--inner); color: var(--text-2); }\r\n.pill.danger { background: var(--danger-soft); color: var(--danger); }\r\n.pill.warn { background: var(--warn-soft); color: var(--warn); }\r\n.pill.ok { background: var(--ok-soft); color: var(--ok); }\r\n\r\n/* avatars */\r\n.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: var(--t-b1); font-weight: 800; color: #14181E; }\r\n.av.s { width: 24px; height: 24px; font-size: var(--t-b3); }\r\n.av.face { font-size: 20px; line-height: 1; }\r\n\r\n/* ---------- the List pattern ---------- */\r\n.list { list-style: none; margin: 0; padding: 0; background: var(--inner); border-radius: var(--r-m); overflow: hidden; }\r\n.list > li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s-s); align-items: center; min-height: var(--target); padding: var(--s-xs) var(--s-m); }\r\n.list > li + li { border-top: 1px solid var(--line); }\r\n.list .lead { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: var(--i-m); background: var(--card); color: var(--text-3); }\r\n.list .what { min-width: 0; }\r\n.list .what b { display: block; font-size: var(--t-h2); font-weight: 600; line-height: 1.3; }\r\n.list .what span { display: block; font-size: var(--t-b2); color: var(--text-3); line-height: 1.35; }\r\n.list .when { font-size: var(--t-b1); font-weight: 600; color: var(--text-3); }\r\n.list li.done .lead { background: var(--ok-soft); color: var(--ok); }\r\n.list li.done .what b { color: var(--text-2); }\r\n.list li.due { box-shadow: inset 4px 0 0 var(--accent); }\r\n.list li.due .lead { background: var(--accent); color: var(--accent-ink); }\r\n.list li.due .when { color: var(--accent); }\r\n.list li.late .lead { background: var(--danger-soft); color: var(--danger); }\r\n.list li.late .when { color: var(--danger); }\r\n\r\n.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-m); align-items: start; }\r\n.cols.media { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); align-items: center; }\r\n.media img, .media .ph { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-m); background: var(--inner); }\r\n.media .ph { display: grid; place-items: center; font-size: var(--t-d2); color: var(--text-3); }\r\n\r\n/* ---------- confirmations ---------- */\r\n.confirm { display: flex; align-items: center; gap: var(--s-m); }\r\n.confirm .tick { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 28px; background: var(--ok-fill); color: #FFFFFF; }\r\n.confirm .tick.neutral { background: var(--btn-1); }\r\n\r\n/* ---------- a question to a parent ---------- */\r\n.asked { font-size: var(--t-h1); color: var(--text-2); }\r\n.asked.big { font-size: var(--t-d4); font-weight: 700; line-height: 1.2; color: var(--text); }\r\n.asked::before { content: '\\201C'; } .asked::after { content: '\\201D'; }\r\n.waiting { display: inline-flex; align-items: center; gap: var(--s-xs); font-size: var(--t-b1); color: var(--text-3); }\r\n.waiting i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: dot 1.2s ease-in-out infinite; }\r\n.waiting i:nth-child(2) { animation-delay: 0.15s; } .waiting i:nth-child(3) { animation-delay: 0.3s; }\r\n\r\n/* ---------- handover check ---------- */\r\n.progress { display: flex; gap: var(--s-2xs); }\r\n.progress i { height: 6px; flex: 1; border-radius: var(--r-c); background: var(--inner); }\r\n.progress i.on { background: var(--accent); }\r\n.progress i.ok { background: var(--ok); }\r\n.progress i.bad { background: var(--danger); }\r\n.score { font-size: var(--t-d1); font-weight: 800; letter-spacing: -0.02em; }\r\n\r\n/* ---------- pay the sitter ---------- */\r\n.amount { font-size: var(--t-d1); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }\r\n.qr { background: #FFFFFF; border-radius: var(--r-m); padding: var(--s-s); display: grid; justify-items: center; gap: var(--s-2xs); color: #14181E; font-size: var(--t-b3); font-weight: 700; }\r\n.qr svg { width: 100%; max-width: 168px; height: auto; }\r\n.qr span { text-align: center; line-height: 1.3; }\r\n.cols.pass { grid-template-columns: minmax(0, 1fr) 196px; }\r\n.cols.pass > div:first-child > * + * { margin-top: var(--s-m); }\r\n\r\n/* ---------- the Carousel pattern (ordering dinner) ---------- */\r\n.carousel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-s); }\r\n.carousel .item { display: flex; flex-direction: column; gap: var(--s-2xs); background: var(--inner); border-radius: var(--r-m); padding: var(--s-s) var(--s-m) var(--s-m); }\r\n.carousel .item .title { font-size: var(--t-d5); }\r\n.carousel .item .pill { align-self: flex-start; }\r\n.carousel .item .actions { margin-top: auto; padding-top: var(--s-xs); }\r\n.compact .carousel { grid-template-columns: 1fr; }\r\n\r\n/* ---------- smart home (simulated) ---------- */\r\n.scene { display: flex; flex-wrap: wrap; gap: var(--s-2xs); align-items: center; }\r\n\r\n/* ================= fullscreen layouts ================= */\r\n.fs { height: var(--vh); overflow: hidden; display: flex; flex-direction: column; gap: var(--s-s); padding: var(--s-s) var(--s-xl) var(--s-m); background: var(--page); color: var(--text); }\r\n.fs .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 32px; }\r\n.fs .bar > :last-child { justify-self: end; }\r\n\r\n/* ---------- Tonight (home) ---------- */\r\n.home .clock { font-size: var(--t-d5); font-weight: 600; letter-spacing: -0.01em; }\r\n.home .clock small { margin-left: var(--s-xs); font-size: var(--t-b2); font-weight: 600; color: var(--text-3); }\r\n.home .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s-s); }\r\n.home .hero { background: var(--card); border-radius: var(--r-l); padding: var(--s-l) var(--s-xl); display: flex; flex-direction: column; min-height: 0; }\r\n.home .hero > * { flex-shrink: 0; } /* the title never gets squeezed; \"Later\" takes what is left */\r\n.home .hero > .later { flex-shrink: 1; min-height: 0; overflow: hidden; }\r\n.home .hero .label { font-size: var(--t-b1); font-weight: 700; color: var(--accent); }\r\n.home .hero.late .label { color: var(--danger); }\r\n.home .hero .title.xl { margin-top: var(--s-2xs); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\r\n.home .hero .when { margin-top: var(--s-xs); font-size: var(--t-h1); color: var(--text-2); }\r\n.home .hero .when b { color: var(--text); }\r\n.home .bar-progress { margin-top: var(--s-m); height: 8px; border-radius: var(--r-c); background: var(--inner); overflow: hidden; }\r\n.home .bar-progress i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }\r\n.home .hero.late .bar-progress i { background: var(--danger); }\r\n.home .hero .later { margin-top: auto; padding-top: var(--s-m); }\r\n.home .hero .later .meta { margin-bottom: var(--s-2xs); }\r\n.home .side { display: flex; flex-direction: column; gap: var(--s-s); min-height: 0; }\r\n.home .side .list { background: var(--card); }\r\n.home .side .list .lead { background: var(--inner); }\r\n.home .side .notice { background: var(--card); border-radius: var(--r-l); padding: var(--s-s) var(--s-m); font-size: var(--t-b1); color: var(--text-2); }\r\n.home .side .notice b { color: var(--text); }\r\n.home .dock { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-xs); }\r\n.home .dock .btn { min-height: 52px; }\r\n.home .steps { list-style: none; margin: var(--s-m) 0 0; padding: 0; display: grid; gap: var(--s-xs); counter-reset: n; }\r\n.home .steps li { counter-increment: n; display: flex; gap: var(--s-s); align-items: center; font-size: var(--t-b1); color: var(--text-2); }\r\n.home .steps li::before { content: counter(n); width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--inner); color: var(--accent); font-weight: 800; font-size: var(--t-b2); }\r\n.home .steps b { color: var(--text); }\r\n\r\n/* night: after lights out the screen is dim and warm, almost nothing on it */\r\n.home.night { color-scheme: dark; --page: #07080A; --card: #101114; --inner: #16181C; --line: #23252A; --text: #E8DCC6; --text-2: #BFAF93; --text-3: #8F826B; --accent: #D9A441; --accent-ink: #1F1600;\r\n  --warn: #D9A441; --warn-soft: #221B0E; --btn-1: #2A2620; --btn-1-text: #E8DCC6; --btn-2: #1B1C20; --btn-2-text: #E8DCC6; }\r\n.home .sleep { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: var(--s-s); }\r\n.home .sleep .moon { font-size: 56px; color: var(--accent); }\r\n.home .sleep .title { color: var(--text); }\r\n\r\n/* ---------- emergency (fullscreen; red in both themes) ---------- */\r\n.emergency { color-scheme: dark; --page: #8E1B12; --card: rgba(255, 255, 255, 0.14); --inner: rgba(0, 0, 0, 0.22); --line: rgba(255, 255, 255, 0.16);\r\n  --text: #FFFFFF; --text-2: #FFE3E0; --text-3: #FFD7D3; color: var(--text); background: var(--page); }\r\n.emergency .flag { display: inline-flex; align-items: center; gap: var(--s-2xs); justify-self: start; min-height: 32px; padding: 0 var(--s-s); border-radius: var(--r-c); background: #FFFFFF; color: #B42318; font-size: var(--t-b2); font-weight: 800; letter-spacing: 0.08em; }\r\n.emergency .flag svg.i { font-size: var(--i-m); }\r\n.emergency .brand { color: #FFD7D3; }\r\n.emergency .top-right { display: flex; gap: var(--s-2xs); align-items: center; }\r\n.emergency .chip { display: inline-flex; align-items: center; gap: var(--s-2xs); min-height: 28px; padding: 0 var(--s-s); border-radius: var(--r-c); background: rgba(0, 0, 0, 0.28); font-size: var(--t-b2); font-weight: 700; }\r\n.emergency .chip.home-soon { background: #FFFFFF; color: #067647; }\r\n.emergency .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--s-s); }\r\n.emergency .stepcard { min-height: 0; display: flex; flex-direction: column; background: #FFFFFF; color: #14181E; border-radius: var(--r-l); padding: var(--s-m) var(--s-l); }\r\n.emergency .stepcar mer.up b { color: #FFD27A; }\r\n.emergency .offline { display: flex; align-items: center; gap: var(--s-2xs); margin: 0 0 var(--s-xs); padding: var(--s-2xs) var(--s-s); border-radius: var(--r-s); background: #FFF4D6; color: #6B4300; font-size: var(--t-b2); font-weight: 700; }\r\n.emergency .offline svg.i { font-size: var(--i-m); flex: none; }\r\n.emergency .warning { font-size: var(--t-b3); line-height: 1.4; color: #FFE3E0; margin-top: auto; }\r\n.emergency .spoken { background: rgba(0, 0, 0, 0.26); border-radius: var(--r-m); padding: var(--s-2xs) var(--s-s); font-size: var(--t-b1); }\r\n.emergency .spoken .pill { background: #FFFFFF; color: #B42318; margin-right: var(--s-xs); }\r\n.emergency.over { --page: #0F5132; }\r\n.emergency.over .center { flex: 1; display: grid; place-content: center; gap: var(--s-s); max-width: 560px; }\r\n.emergency.over .list { background: rgba(0, 0, 0, 0.22); }\r\n.emergency.over .list .what b { color: #FFFFFF; }\r\n.emergency.over .list .when { color: #CFEFDF; }\r\n\r\n/* paramedic sheet: clinical and white in both themes */\r\n.sheet { --page: #F5F7FA; --card: #FFFFFF; --inner: #EEF1F5; --line: #DCE1E8; --text: #14181E; --text-2: #3E4652; --text-3: #5B6371; color: var(--text); }\r\n.sheet .cols { flex: 1; min-height: 0; }\r\n.sheet .block { background: var(--card); border-radius: var(--r-l); padding: var(--s-s) var(--s-m); }\r\n.sheet .block h3 { margin: 0 0 var(--s-2xs); font-size: var(--t-b2); color: #B42318; text-transform: uppercase; letter-spacing: 0.06em; }\r\n.sheet .block ul { margin: 0; padding-left: 1.1em; font-size: var(--t-b1); }\r\n\r\n/* ---------- goodnight message ---------- */\r\n.goodnight { color-scheme: dark; --page: #120E0A; --card: #1C1610; --inner: #2A2118; --line: #33291E; --text: #F3E6CF; --text-2: #D9C29A; --text-3: #A8936E; --accent: #E8B65A; color: var(--text); }\r\n.goodnight .grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--s-xl); align-items: center; }\r\n.goodnight .title { color: #F8EBD3; }\r\n.goodnight .caption { margin-top: var(--s-s); font-family: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, serif; font-style: italic; font-size: var(--t-d5); line-height: 1.35; color: #EBCB93; }\r\n.goodnight .btn { background: #2A2118; color: #F3E6CF; }\r\n.goodnight .player { display: grid; place-items: center; }\r\n.goodnight video { width: 100%; max-height: calc(var(--vh) - 120px); border-radius: var(--r-l); background: #000; }\r\n.wave { width: 200px; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 6px; background: #2A2118; }\r\n.wave i { width: 8px; height: 30px; border-radius: var(--r-c); background: #E8B65A; will-change: transform; }\r\n.wave i:nth-child(1), .wave i:nth-child(12) { transform: scaleY(0.45); }\r\n.wave i:nth-child(2), .wave i:nth-child(11) { transform: scaleY(0.75); }\r\n.wave i:nth-child(3), .wave i:nth-child(10) { transform: scaleY(1.05); }\r\n.wave i:nth-child(4), .wave i:nth-child(9) { transform: scaleY(1.4); }\r\n.wave i:nth-child(5), .wave i:nth-child(8) { transform: scaleY(1.75); }\r\n.wave i:nth-child(6), .wave i:nth-child(7) { transform: scaleY(2); }\r\n.goodnight.playing .wave i { animation: wave 1.1s ease-in-out infinite; }\r\n.goodnight.playing .wave i:nth-child(2n) { animation-delay: 0.15s; }\r\n.wave.live i { animation: none !important; transition: transform 80ms linear; }\r\n.goodnight .end { text-align: center; font-family: \"Iowan Old Style\", Georgia, serif; font-style: italic; font-size: var(--t-d5); color: #EBCB93; opacity: 0; transition: opacity 1.2s var(--ease); }\r\n.goodnight.ended .end { opacity: 1; }\r\n\r\n/* ---------- compact (phones and narrow previews): no zoom, one column ---------- */\r\n.compact .cols, .compact .cols.media, .compact .home .grid, .compact .emergency .grid, .compact .goodnight .grid { grid-template-columns: 1fr; }\r\n.compact .fs { height: auto; min-height: var(--vh); overflow: visible; }\r\n.compact .home .dock { grid-template-columns: 1fr; }\r\n/* A phone's top bar has room for what's happening, not the logo as well; chips stay on one line. */\r\n.compact .fs .bar .brand { display: none; }\r\n.compact .fs .bar .chip, .compact .fs .bar .flag, .compact .home .clock { white-space: nowrap; }\r\n\r\n/* ---------- short screens (Echo Show 5 and 21): only what matters fits ---------- */\r\n.short .title.xl { font-size: var(--t-d3); }\r\n.short .home .hero .steps li + li, .short .home .hero > .later { display: none; }\r\n.short .emergency .box.alerted { display: none; }\r\n.short .emergency .addr b { font-size: var(--t-b1); }\r\n.short .emergency.over .list li:nth-last-child(n+3) { display: none; }\r\n\r\n/* ---------- motion: calm, no flashing ---------- */\r\n#root.enter > * { animation: card-in 0.3s var(--ease) backwards; }\r\n@keyframes card-in { from { opacity: 0; transform: translateY(10px); } }\r\n@keyframes step-in { from { opacity: 0; transform: translateX(16px); } }\r\n@keyframes dot { 0%, 60%, 100% { opacity: 0.35; } 30% { opacity: 1; } }\r\n@keyframes wave { 50% { transform: scaleY(2.4); } }\r\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\r\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"root\">\u003cdiv class=\"panel\">\u003cp class=\"sub\">Loading…\u003c/p>\u003c/div>\u003c/div>\n\u003cscript>// While You're Out: one MCP App that renders every card. Plain JavaScript, no build step.\r\n// Protocol (MCP Apps): ui/initialize -> ui/notifications/initialized -> ui/notifications/tool-result.\r\n// The Tonight screen also calls tools through the host (tools/call) to keep itself up to date,\r\n// and its buttons send what the carer would say (ui/message).\r\n// Built to the Alexa+ add-on design guide: authored on the 768 x 480 base canvas, one root zoom\r\n// per device (from the host's deviceClass), light and dark, the Card and List patterns, the logo\r\n//   if (m.method === 'ui/initialize') {
    reply({ protocolVersion: '2026-01-26', hostInfo: { name: 'screens', version: '1' }, hostCapabilities: {},
      hostContext: { theme, deviceClass: D.mobile ? 'mobile' : DEVICE, isMobile: Boolean(D.mobile), displayMode: FULL.includes(shot.tool) ? 'fullscreen' : 'inline', maxWidth: D.w, maxHeight: D.h } });
  } else if (m.method === 'ui/notifications/initialized') {
    f.contentWindow.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: shot.result }, '*');
  } else if (m.method === 'tools/call') {
    reply(shot.result);
  } else if (m.id != null) {
    reply({});
  }
});
